# GitLab CI/CD Pipeline para Sistema de Gestión de Matrículas con IA

stages:
  - test
  - build
  - release
  - deploy

variables:
  NODE_VERSION: "18"
  IMAGE_NAME: $CI_REGISTRY_IMAGE
  DOCKER_TLS_CERTDIR: "/certs"

# Cache de dependencias
cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - node_modules/

# ====================
# Stage: Test
# ====================

lint-test:
  stage: test
  image: node:${NODE_VERSION}
  before_script:
    - npm ci
  script:
    - npm run lint
    - npm test
  only:
    - branches
    - merge_requests
  allow_failure: true

# ====================
# Stage: Build
# ====================

build-docker:
  stage: build
  image: docker:24.0.5
  services:
    - docker:24.0.5-dind
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin $CI_REGISTRY
  script:
    - docker buildx create --use
    - |
      docker buildx build \
        --cache-from type=registry,ref=$IMAGE_NAME:buildcache \
        --cache-to type=registry,ref=$IMAGE_NAME:buildcache,mode=max \
        --push \
        --tag $IMAGE_NAME:$CI_COMMIT_SHORT_SHA \
        --tag $IMAGE_NAME:$CI_COMMIT_REF_SLUG \
        .
  only:
    - branches
    - tags

# ====================
# Stage: Release
# ====================

create-release:
  stage: release
  image: node:${NODE_VERSION}
  before_script:
    - npm ci
    - apt-get update && apt-get install -y git
  script:
    - git config user.name "GitLab CI"
    - git config user.email "gitlab-ci@${CI_SERVER_HOST}"
    - npm run release
    - git push --follow-tags $CI_REPOSITORY_URL HEAD:$CI_COMMIT_REF_NAME
  only:
    - main
  when: manual

release-docker:
  stage: release
  image: docker:24.0.5
  services:
    - docker:24.0.5-dind
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin $CI_REGISTRY
  script:
    - docker buildx create --use
    - |
      docker buildx build \
        --cache-from type=registry,ref=$IMAGE_NAME:buildcache \
        --cache-to type=registry,ref=$IMAGE_NAME:buildcache,mode=max \
        --push \
        --tag $IMAGE_NAME:${CI_COMMIT_TAG} \
        --tag $IMAGE_NAME:latest \
        .
    - echo "## 🚀 Release $CI_COMMIT_TAG" >> release_notes.md
    - echo "" >> release_notes.md
    - echo "### 📦 Docker Image" >> release_notes.md
    - echo "- \`$IMAGE_NAME:${CI_COMMIT_TAG}\`" >> release_notes.md
    - echo "- \`$IMAGE_NAME:latest\`" >> release_notes.md
    - echo "" >> release_notes.md
    - echo "### 📝 Pull Image" >> release_notes.md
    - echo "\`\`\`bash" >> release_notes.md
    - echo "docker pull $IMAGE_NAME:${CI_COMMIT_TAG}" >> release_notes.md
    - echo "\`\`\`" >> release_notes.md
  only:
    - tags
  artifacts:
    paths:
      - release_notes.md
    expire_in: 30 days

# ====================
# Stage: Deploy
# ====================

deploy-dev:
  stage: deploy
  image: alpine:latest
  environment:
    name: development
    url: http://dev.example.com
  before_script:
    - apk add --no-cache openssh-client
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - ssh-keyscan $DEV_SERVER_HOST >> ~/.ssh/known_hosts
    - chmod 644 ~/.ssh/known_hosts
  script:
    - |
      ssh $DEV_USER@$DEV_SERVER_HOST << 'EOF'
        cd $DEV_APP_PATH
        docker compose pull
        docker compose up -d
        docker image prune -f
      EOF
  only:
    - develop
  when: manual

deploy-prod:
  stage: deploy
  image: alpine:latest
  environment:
    name: production
    url: http://production.example.com
  before_script:
    - apk add --no-cache openssh-client
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - ssh-keyscan $PROD_SERVER_HOST >> ~/.ssh/known_hosts
    - chmod 644 ~/.ssh/known_hosts
  script:
    - |
      ssh $PROD_USER@$PROD_SERVER_HOST << 'EOF'
        cd $PROD_APP_PATH
        docker compose pull
        docker compose up -d
        docker image prune -f
      EOF
  only:
    - tags
  when: manual

# Deploy con Kubernetes (alternativo)
deploy-k8s-dev:
  stage: deploy
  image: bitnami/kubectl:latest
  environment:
    name: development
    url: http://dev.example.com
  before_script:
    - echo "$KUBE_CONFIG_DEV" | base64 -d > kubeconfig
    - export KUBECONFIG=kubeconfig
  script:
    - kubectl set image deployment/app app=$IMAGE_NAME:$CI_COMMIT_SHORT_SHA -n dev
    - kubectl rollout status deployment/app -n dev
  only:
    - develop
  when: manual

deploy-k8s-prod:
  stage: deploy
  image: bitnami/kubectl:latest
  environment:
    name: production
    url: http://production.example.com
  before_script:
    - echo "$KUBE_CONFIG_PROD" | base64 -d > kubeconfig
    - export KUBECONFIG=kubeconfig
  script:
    - kubectl set image deployment/app app=$IMAGE_NAME:${CI_COMMIT_TAG} -n prod
    - kubectl rollout status deployment/app -n prod
  only:
    - tags
  when: manual
