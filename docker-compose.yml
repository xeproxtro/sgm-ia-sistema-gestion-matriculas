services:
  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: sgm-ia-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${DB_NAME:-sgm_ia_db}
      MYSQL_USER: sgm_app_user
      MYSQL_PASSWORD: ${DB_PASSWORD:-sgm_password}
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - sgm-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_PASSWORD:-rootpassword}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Node.js Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sgm-ia-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3000
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-sgm_ia_db}
      DB_USER: sgm_app_user
      DB_PASSWORD: ${DB_PASSWORD:-sgm_password}
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-in-production}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-24h}
      EMAIL_HOST: ${EMAIL_HOST:-smtp.gmail.com}
      EMAIL_PORT: ${EMAIL_PORT:-587}
      EMAIL_USER: ${EMAIL_USER}
      EMAIL_PASS: ${EMAIL_PASS}
      AI_API_KEY: ${AI_API_KEY}
      AI_API_URL: ${AI_API_URL:-https://api.openai.com/v1/chat/completions}
      BATCH_SIZE: ${BATCH_SIZE:-200}
      QUEUE_CHECK_INTERVAL: ${QUEUE_CHECK_INTERVAL:-5000}
      MAINTENANCE_MODE: ${MAINTENANCE_MODE:-false}
      MAINTENANCE_MESSAGE: ${MAINTENANCE_MESSAGE:-Sistema en mantenimiento}
    volumes:
      - app_uploads:/app/src/whatever/uploads
      - ./MICROSERVICIOS.md:/app/MICROSERVICIOS.md:ro
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - sgm-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # phpMyAdmin (Optional - for database management)
  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: sgm-ia-phpmyadmin
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_USER: sgm_app_user
      PMA_PASSWORD: ${DB_PASSWORD:-sgm_password}
      UPLOAD_LIMIT: 100M
    depends_on:
      - mysql
    networks:
      - sgm-network
    profiles:
      - tools

volumes:
  mysql_data:
    driver: local
  app_uploads:
    driver: local

networks:
  sgm-network:
    driver: bridge
