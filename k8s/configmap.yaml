apiVersion: v1
kind: ConfigMap
metadata:
  name: sgm-ia-config
  namespace: default
data:
  NODE_ENV: "production"
  PORT: "3000"
  DB_HOST: "mysql-service"
  DB_PORT: "3306"
  DB_NAME: "sgm_ia_db"
  DB_USER: "root"
  JWT_EXPIRES_IN: "24h"
  EMAIL_HOST: "smtp.gmail.com"
  EMAIL_PORT: "587"
  AI_API_URL: "https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent"
  AI_MODEL: "gemini-1.5-flash"
  BATCH_SIZE: "200"
  QUEUE_CHECK_INTERVAL: "5000"
  MAINTENANCE_MODE: "false"
  MAINTENANCE_MESSAGE: "Sistema en mantenimiento"
