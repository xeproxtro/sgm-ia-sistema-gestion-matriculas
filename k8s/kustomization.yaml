apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: default

resources:
  - configmap.yaml
  - secret.yaml
  - mysql-deployment.yaml
  - app-deployment.yaml

images:
  - name: sgm-ia
    newName: sgm-ia
    newTag: latest

commonLabels:
  app.kubernetes.io/name: sgm-ia
  app.kubernetes.io/instance: sgm-ia
  app.kubernetes.io/managed-by: kustomize
